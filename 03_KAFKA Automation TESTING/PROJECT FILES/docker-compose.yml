name: kafka-qa

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka-qa-broker
    ports:
      - '9092:9092' # host access for the Mocha tests (localhost:9092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false' # topics are created explicitly by kafka-init
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  # One-shot job: creates the three topics used by the flows and tests, then exits.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -e
        for t in qa.orders.v1 qa.orders.processed.v1 qa.orders.dlq.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$$t" --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: 'no'

  node-red:
    build: ./node-red
    image: kafka-qa-node-red:local
    container_name: kafka-qa-node-red
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - '1880:1880'
    environment:
      TZ: UTC
      KAFKA_BROKERS: kafka:19092
      ORDERS_TOPIC: qa.orders.v1
      PROCESSED_TOPIC: qa.orders.processed.v1
      DLQ_TOPIC: qa.orders.dlq.v1
      CONSUMER_GROUP_ID: nodered-order-processor
      PRODUCER_RETRIES: '2'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:1880/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
